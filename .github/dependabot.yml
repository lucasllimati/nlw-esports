# Documentação de todas as opções:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Servidor (Backend)
  - package-ecosystem: "npm"
    directory: "/ignite/server"
    schedule:
      interval: "weekly"
    # Espera alguns dias após a publicação antes de propor a versão:
    # reduz o risco de instalar um pacote comprometido recém-publicado
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      server-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 2. App (Mobile)
  - package-ecosystem: "npm"
    directory: "/ignite/mobile"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      mobile-dependencies:
        patterns: ["*"]
        update-types: ["patch"]
    # Estes pacotes têm a versão fixada pelo Expo SDK. Atualize-os junto com
    # o SDK, manualmente: `npx expo install expo@^<sdk> --fix`
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 3. Web (Frontend)
  - package-ecosystem: "npm"
    directory: "/ignite/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 4. GitHub Actions (as actions são fixadas por SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
